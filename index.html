<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AVR Tutor</title>
  <style>
    body {font-family: sans-serif}
    #prg td:nth-child(2) { font-family: monospace}
    #prg td:nth-child(3) { font-size: 85%; color: #555}
    #prg td:nth-child(1) { font-size: 85%; font-weight: bold; text-align: center}
    td {padding: 2px}
    tr[cur] { background-color: yellow}
    #regs td { text-align: center}
    .pins td:not(:first-child) { text-align: center}
    table { width: 100%}
    .moveit { text-decoration: none; text-weight: bold}
    input { text-align: center}
    @media screen and (orientation: landscape) {
      .container { width: 800px}
    }
}  </style>
</head>
<body>
<center>
<h1>AVR Tutor</h1>
<div class="container">
  <h3>Program</h3>
  <table id="prg" border="1" onclick="tableClick()">
    <tr><th>Addr</th><th>Code</th><th>Info</th></tr>
    <tr><td></td><td>&nbsp;</td><td></td></tr>
  </table>
  <br/>
  <button onclick="btnStep()">Step</button>
  <button id="btnrun" onclick="btnRun()">Run</button>
  <button onclick="btnReset()">Reset</button>
</div>

<div class="container">
  <h3>Registers</h3>
  <table id="regs" border="1">
    <tr><td>r0..3</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r4..7</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r8..11</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r12..15</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r16..19</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r20..23</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r24..27</td><td></td><td></td><td></td><td></td></tr>
    <tr><td>r28..31</td><td></td><td></td><td></td><td></td></tr>
  </table>
  <br/>
  Carry=<span id="flag-c"></span> Zero=<span id="flag-z"></span>
</div>

<div class="container">
  <h3>Pins</h3>
  <table id="pins-b" class="pins" border="1">
    <tr><th>&nbsp;</th><th>7</th><th>6</th><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th><th>0</th></td>
    <tr><td><b>LEDS</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>DDRB 0x24</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>PORTB 0x25</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>PINB 0x23</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td><b>Buttons</b></td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr>
  </table>
</div>

<div class="container">
  <h3>Settings</h3>
  <label>Run delay: <input type="text" id="run-delay" value="100"/></label>
  <br/><br/>
  <button onclick="beepCodeOut()">Beep-beep-beep!</button>
  &nbsp;&nbsp;&nbsp;
  <label>volume: <input size="5" type="text" id="beep-volume" value="50"/> %</label>
</div>

</center>

<script src="./avrtutor.js"></script>
<script src="./beep.js"></script>
</body>
</html>
